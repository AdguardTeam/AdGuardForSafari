# One-click production release: validates and creates a semver tag, then
# immediately runs deploy-app.yml for it via workflow_call (no dependency
# on the tag-push event).
#
# Usage: Actions tab → Run workflow; set `tag` (e.g. v2.5.0) and pick the
# branch or pin `ref` (empty = HEAD of the picked branch).
#
# See docs/production-build-and-deploy.md.

name: Tag & Deploy
run-name: 'Tag ${{ inputs.tag }}'

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Semver tag to create and deploy (e.g. v2.5.0, v2.6.0-beta.1)'
        type: string
        required: true
      slack-channel:
        description: 'Slack channel override; empty derives #proj-ag-<major>-<minor>-mini-mac from the tag, adding -<patch> when patch != 0'
        type: string
        default: ''
      ref:
        description: 'Git ref to tag (SHA or branch). Empty = current HEAD.'
        type: string
        default: ''

permissions:
  contents: write
  id-token: write
  actions: read

jobs:

  # Parses the tag into the major/minor/patch the channel check needs.
  meta:
    if: github.repository == 'AdGuardSoftwareLimited/sciter-adguard-mini'
    name: Version metadata
    uses: AdGuardSoftwareLimited/actions/.github/workflows/version-metadata.yml@master
    with:
      team: mac
      tag: ${{ inputs.tag }}

  # Runs before the tag exists, so a bad channel leaves no tag behind.
  check-slack-channel:
    if: github.repository == 'AdGuardSoftwareLimited/sciter-adguard-mini'
    name: Check Slack channel
    needs: [meta]
    runs-on: [team-mac]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Derive Slack channel
        id: derive
        uses: ./.github/actions/derive-slack-channel
        with:
          product: ag
          platform: mini-mac
          release: ${{ needs.meta.outputs.release }}
          channel: ${{ inputs.slack-channel }}

      - name: Check Slack channel access
        uses: AdGuardSoftwareLimited/actions/actions/check-slack-channel@master
        with:
          channel: ${{ steps.derive.outputs.channel }}

  # Validates the requested tag and creates it. A malformed tag fails here.
  tag:
    if: github.repository == 'AdGuardSoftwareLimited/sciter-adguard-mini'
    name: Validate & tag
    needs: [check-slack-channel]
    uses: AdGuardSoftwareLimited/actions/.github/workflows/validate-and-tag.yml@master
    with:
      team: mac
      tag: ${{ inputs.tag }}
      ref: ${{ inputs.ref }}
    secrets: inherit

  # Runs the production pipeline (deploy-app.yml) for the new tag and
  # reports the result to the resolved Slack channel.
  deploy:
    if: github.repository == 'AdGuardSoftwareLimited/sciter-adguard-mini'
    name: Deploy
    needs: [tag]
    uses: ./.github/workflows/deploy-app.yml
    with:
      tag: ${{ inputs.tag }}
      slack-channel: ${{ inputs.slack-channel }}
    secrets: inherit
